<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-API Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-wrapper">
        <header class="top-bar">
            <h1>Analytics Dashboard</h1>
            <div class="header-actions">
                <span id="loadTimeBadge" class="time-badge">Ready</span>
                <button id="refreshBtn" class="refresh-btn">
                    <span class="icon">↻</span> Refresh All
                </button>
            </div>
        </header>

        <div id="globalOverlay" class="global-overlay hidden">
            <div class="spinner large"></div>
            <h2>Fetching Data...</h2>
        </div>

        <div class="widgets-grid">
            <div class="widget">
                <div class="widget-header">
                    <h3>System Users</h3>
                    <span class="widget-icon">👥</span>
                </div>
                <div id="usersWidget" class="widget-body">
                    <div class="skeleton-list"></div>
                </div>
            </div>

            <div class="widget">
                <div class="widget-header">
                    <h3>Weather (Hanoi)</h3>
                    <span class="widget-icon">⛅</span>
                </div>
                <div id="weatherWidget" class="widget-body">
                    <div class="skeleton-list"></div>
                </div>
            </div>

            <div class="widget">
                <div class="widget-header">
                    <h3>Random Dog</h3>
                    <span class="widget-icon">🐕</span>
                </div>
                <div id="dogWidget" class="widget-body">
                    <div class="skeleton-list"></div>
                </div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
