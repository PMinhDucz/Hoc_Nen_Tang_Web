<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="weather-container">
        <h1>Weather Forecast</h1>
        <form id="searchForm">
            <input type="text" id="cityInput" placeholder="Enter city name..." autocomplete="off">
            <button type="submit">Search</button>
        </form>

        <div class="history-container">
            <h3>Recent Searches</h3>
            <div id="historyList" class="history-list"></div>
        </div>

        <div id="statusMessage" class="status hidden"></div>
        <div id="spinner" class="spinner hidden"></div>

        <div id="weatherResult" class="weather-card hidden">
            <h2 id="cityName"></h2>
            <div class="weather-main">
                <span id="weatherIcon" class="weather-icon"></span>
                <span id="temperature" class="temperature"></span>
            </div>
            <div class="weather-desc" id="weatherDesc"></div>
            <div class="weather-details">
                <div class="detail-item">
                    <span>Humidity</span>
                    <strong id="humidity"></strong>
                </div>
                <div class="detail-item">
                    <span>Wind</span>
                    <strong id="windSpeed"></strong>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
