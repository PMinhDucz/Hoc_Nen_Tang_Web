<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite Scroll Gallery</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <header class="gallery-header">
        <h1>Photo Explorer</h1>
        <p>Scroll down to load more amazing moments</p>
    </header>

    <main class="container">
        <div id="galleryGrid" class="gallery-grid"></div>
        
        <div id="loadingIndicator" class="loading-indicator">
            <div class="spinner"></div>
            <span>Đang tải thêm...</span>
        </div>
        
        <div id="loadTrigger" class="load-trigger"></div>
    </main>

    <div id="lightbox" class="lightbox">
        <span id="closeLightbox" class="close-btn">&times;</span>
        <div class="lightbox-content">
            <img id="lightboxImage" src="" alt="Large view">
            <div id="lightboxAuthor" class="lightbox-author"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
