<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind Components Library</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">

    <div class="max-w-5xl mx-auto space-y-12">
        <h1 class="text-3xl font-bold text-gray-800 border-b pb-4">TailwindCSS Component Library</h1>

        <section class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
            <h2 class="text-xl font-semibold mb-6 text-gray-700">1. Buttons</h2>
            <div class="flex flex-wrap items-end gap-4">
                
                <button class="bg-blue-600 text-white px-5 py-2.5 rounded-lg hover:bg-blue-700 focus:ring-4 focus:ring-blue-300 transition-colors font-medium">
                    Primary Button
                </button>
                
                <button class="bg-gray-600 text-white px-5 py-2.5 rounded-lg hover:bg-gray-700 focus:ring-4 focus:ring-gray-300 transition-colors font-medium">
                    Secondary
                </button>
                
                <button class="border-2 border-blue-600 text-blue-600 px-5 py-2.5 rounded-lg hover:bg-blue-50 focus:ring-4 focus:ring-blue-100 transition-colors font-medium">
                    Outline Button
                </button>
                
                <button class="bg-blue-400 text-white px-5 py-2.5 rounded-lg cursor-not-allowed opacity-60 font-medium" disabled>
                    Disabled
                </button>
                
                <button class="bg-blue-600 text-white px-5 py-2.5 rounded-lg flex items-center font-medium cursor-wait">
                    <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    Processing...
                </button>
            </div>
            
            <div class="flex items-center gap-4 mt-6 pt-6 border-t">
                <button class="bg-indigo-600 text-white px-3 py-1.5 text-sm rounded hover:bg-indigo-700">Small</button>
                <button class="bg-indigo-600 text-white px-5 py-2.5 rounded-lg hover:bg-indigo-700">Medium</button>
                <button class="bg-indigo-600 text-white px-6 py-3.5 text-lg rounded-xl hover:bg-indigo-700">Large Size</button>
            </div>
        </section>


        <section class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
            <h2 class="text-xl font-semibold mb-6 text-gray-700">2. Cards</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                
                <div class="border rounded-xl overflow-hidden hover:shadow-lg transition-shadow">
                    <img src="https://via.placeholder.com/400x200" alt="Product" class="w-full h-40 object-cover">
                    <div class="p-4">
                        <h3 class="font-bold text-lg mb-1">Wireless Earbuds</h3>
                        <p class="text-gray-500 text-sm mb-3">Chất âm trung thực, pin 24h.</p>
                        <div class="flex justify-between items-center">
                            <span class="text-blue-600 font-bold">1.200.000đ</span>
                            <button class="text-sm bg-gray-100 hover:bg-gray-200 text-gray-800 px-3 py-1 rounded">Mua</button>
                        </div>
                    </div>
                </div>

                <div class="border rounded-xl p-6 text-center hover:border-blue-500 transition-colors">
                    <img src="https://via.placeholder.com/150" alt="Profile" class="w-24 h-24 rounded-full mx-auto mb-4 border-4 border-gray-100">
                    <h3 class="font-bold text-lg text-gray-800">Trần Văn B</h3>
                    <p class="text-blue-600 text-sm font-medium mb-4">UI/UX Designer</p>
                    <div class="flex justify-center gap-2">
                        <button class="bg-blue-600 text-white px-4 py-1.5 rounded-full text-sm hover:bg-blue-700">Connect</button>
                        <button class="border border-gray-300 px-4 py-1.5 rounded-full text-sm hover:bg-gray-50">Message</button>
                    </div>
                </div>

                <div class="border rounded-xl p-6 bg-gradient-to-br from-indigo-500 to-purple-600 text-white shadow-lg transform hover:scale-105 transition-transform">
                    <span class="bg-white/20 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">Pro Plan</span>
                    <div class="mt-4 mb-6">
                        <span class="text-4xl font-extrabold">$29</span>
                        <span class="text-indigo-200">/tháng</span>
                    </div>
                    <ul class="space-y-3 mb-6 text-sm text-indigo-100">
                        <li class="flex items-center"><svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> 5 Users</li>
                        <li class="flex items-center"><svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> 50GB Storage</li>
                        <li class="flex items-center"><svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> Priority Support</li>
                    </ul>
                    <button class="w-full bg-white text-indigo-600 font-bold py-2 rounded-lg hover:bg-gray-100 transition-colors">Upgrade Now</button>
                </div>
            </div>
        </section>

        <section class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
            <h2 class="text-xl font-semibold mb-6 text-gray-700">3. Forms</h2>
            <div class="max-w-md space-y-5">
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email address</label>
                    <input type="email" placeholder="you@example.com" 
                        class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-shadow">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Country</label>
                    <select class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-shadow bg-white">
                        <option>Vietnam</option>
                        <option>United States</option>
                        <option>Japan</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Message</label>
                    <textarea rows="3" placeholder="Write your message here..."
                        class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-shadow resize-none"></textarea>
                </div>

                <div class="flex items-start">
                    <div class="flex items-center h-5">
                        <input id="terms" type="checkbox" class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500 cursor-pointer">
                    </div>
                    <div class="ml-3 text-sm">
                        <label for="terms" class="font-medium text-gray-700 cursor-pointer">I agree to the Terms</label>
                        <p class="text-gray-500">You must agree before continuing.</p>
                    </div>
                </div>
            </div>
        </section>

    </div>
</body>
</html>
