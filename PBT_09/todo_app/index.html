<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stunning Todo App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>TODO</h1>
        </header>
        <main>
            <form id="todoForm">
                <div class="input-group">
                    <span class="circle-placeholder"></span>
                    <input type="text" id="todoInput" placeholder="Create a new todo..." autocomplete="off">
                </div>
            </form>
            
            <div class="todo-wrapper">
                <ul id="todoList"></ul>
                <div class="todo-footer">
                    <span id="itemsLeft">0 items left</span>
                    <div class="filters">
                        <button class="filter-btn active" data-filter="all">All</button>
                        <button class="filter-btn" data-filter="active">Active</button>
                        <button class="filter-btn" data-filter="completed">Completed</button>
                    </div>
                    <button id="clearCompleted">Clear Completed</button>
                </div>
            </div>
        </main>
        <p class="hint">Double-click on a text to edit</p>
    </div>
    <script src="app.js"></script>
</body>
</html>
