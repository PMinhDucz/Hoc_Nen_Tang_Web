<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Form Validator</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="form-wrapper">
            <h2>Create an Account</h2>
            <form id="registerForm">
                <div class="form-control">
                    <label for="username">Full Name</label>
                    <div class="input-wrap">
                        <input type="text" id="username" placeholder="e.g. John Doe">
                        <span class="status-icon"></span>
                    </div>
                    <small class="error-msg"></small>
                </div>

                <div class="form-control">
                    <label for="email">Email Address</label>
                    <div class="input-wrap">
                        <input type="email" id="email" placeholder="john@example.com">
                        <span class="status-icon"></span>
                    </div>
                    <small class="error-msg"></small>
                </div>

                <div class="form-control">
                    <label for="phone">Phone Number</label>
                    <div class="input-wrap">
                        <input type="text" id="phone" placeholder="0901-234-567" maxlength="12">
                        <span class="status-icon"></span>
                    </div>
                    <small class="error-msg"></small>
                </div>

                <div class="form-control">
                    <label for="password">Password</label>
                    <div class="input-wrap">
                        <input type="password" id="password" placeholder="Create a password">
                        <span class="status-icon"></span>
                    </div>
                    <div class="strength-meter">
                        <div class="strength-bar" id="strengthBar"></div>
                    </div>
                    <small class="strength-text" id="strengthText"></small>
                </div>

                <div class="form-control">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="input-wrap">
                        <input type="password" id="confirmPassword" placeholder="Confirm your password">
                        <span class="status-icon"></span>
                    </div>
                    <small class="error-msg"></small>
                </div>

                <button type="submit" id="submitBtn" disabled>Sign Up</button>
            </form>
        </div>
    </div>

    <div class="modal" id="successModal">
        <div class="modal-content">
            <div class="success-icon">✓</div>
            <h3>Registration Successful!</h3>
            <div id="modalData"></div>
            <button class="close-btn" id="closeModal">Awesome</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
