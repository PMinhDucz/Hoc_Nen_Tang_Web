<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyboard & Accessibility App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Accessibility Gallery</h1>
        <p>Press <strong>Ctrl + K</strong> to open Command Palette</p>
    </header>

    <main class="gallery-container">
        <div class="gallery-info">
            <h2>Nature Collection</h2>
            <p>Use <kbd>←</kbd> <kbd>→</kbd> to navigate, <kbd>1</kbd>-<kbd>9</kbd> to jump, <kbd>Space</kbd> for slideshow.</p>
            <div id="slideshowStatus" class="status-badge">Paused</div>
        </div>
        
        <div class="main-view" aria-label="Image gallery main view">
            <img id="mainImage" src="https://placehold.co/800x400?text=Image+1" alt="Gallery image 1" tabindex="0">
            <div class="controls">
                <button id="prevBtn" aria-label="Previous image">◀</button>
                <span id="counter">1 / 9</span>
                <button id="nextBtn" aria-label="Next image">▶</button>
            </div>
        </div>

        <div class="thumbnails" role="list" aria-label="Image thumbnails">
            <!-- Thumbnails generated by JS -->
        </div>
    </main>

    <div id="commandPalette" class="palette-overlay" aria-hidden="true" role="dialog" aria-modal="true">
        <div class="palette-content">
            <input type="text" id="paletteInput" placeholder="Type a command..." aria-label="Command search">
            <ul id="commandList" role="listbox">
                <!-- Commands generated by JS -->
            </ul>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
