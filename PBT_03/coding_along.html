<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width: 300px;
            padding:20px;
            border: 5px solid black;

        }

        .content-box{
            box-sizing: content-box;
            background: lightblue;
        }
        .border-box{
            box-sizing:border-box;
            background: lightcoral;
        }
        .margin-1{
            margin-bottom:30px;
            background: lightgreen;
            height:50px;

        }
        .margin-2{
            margin-top:40px;
            background: yellow;
            height:50px;

        }

    </style>
</head>
<body>
    <div class="box content-box">Box 1 (Content Box)</div>
    <div class="box border-box">Box 2(Border Box)</div>
    <div class="margin-1"> khoi 1</div>
    <div class="margin-2"> khoi 2</div>

</body>
</html>
