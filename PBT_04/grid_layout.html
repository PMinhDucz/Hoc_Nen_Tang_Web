<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B3 - E-Commerce Grid Layout</title>
    <link rel="stylesheet" href="grid.css">
</head>
<body>
    <div class="grid-container">
        <header class="header">
            <h2>Shop Mua Sắm E-Commerce</h2>
        </header>

        <section class="hero">
            <h1>Khuyến Mãi Lớn Mùa Hè - Giảm 50%</h1>
        </section>

        <aside class="sidebar">
            <h3>Bộ lọc sản phẩm</h3>
            <div class="filter-group">
                <label><input type="checkbox"> Điện thoại</label><br>
                <label><input type="checkbox"> Laptop</label><br>
                <label><input type="checkbox"> Phụ kiện</label><br>
            </div>
            <div class="filter-group">
                <label><input type="checkbox"> Dưới 5 triệu</label><br>
                <label><input type="checkbox"> 5 - 15 triệu</label><br>
                <label><input type="checkbox"> Trên 15 triệu</label><br>
            </div>
        </aside>

        <main class="main-content">
            <!-- Khu vực này sẽ chứa grid con (sub-grid) các sản phẩm -->
            <p>Đang tải danh sách sản phẩm...</p>
        </main>

        <aside class="ads">
            <h3>Quảng cáo</h3>
            <img src="https://via.placeholder.com/150x400" alt="Banner quảng cáo" style="max-width: 100%; margin-top: 15px;">
        </aside>

        <footer class="footer">
            <p>© 2026 Shop Mua Sắm E-Commerce. All rights reserved.</p>
        </footer>
    </div>
</body>
</html>
