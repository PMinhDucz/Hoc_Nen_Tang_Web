<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B2 - Flexbox Layout</title>
    <link rel="stylesheet" href="flexbox.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">ShopTLU</div>
        <div class="menu">
            <a href="#">Home</a>
            <a href="#">Products</a>
            <a href="#">About</a>
        </div>
        <div class="auth-buttons">
            <button class="btn-login">Login</button>
            <button class="btn-register">Register</button>
        </div>
    </nav>

    <main class="main-content">
        <h1 class="page-title">Sản phẩm mới nhất</h1>
        <div class="product-grid">
            <div class="card">
                <img src="https://via.placeholder.com/250x150" alt="Product 1">
                <h3>Sản phẩm 1</h3>
                <p class="price">1.500.000đ</p>
                <button class="btn-buy">Mua ngay</button>
            </div>
            <div class="card">
                <img src="https://via.placeholder.com/250x150" alt="Product 2">
                <h3>Sản phẩm 2 với tên rất dài để test thử margin auto</h3>
                <p class="price">2.000.000đ</p>
                <button class="btn-buy">Mua ngay</button>
            </div>
            <div class="card">
                <img src="https://via.placeholder.com/250x150" alt="Product 3">
                <h3>Sản phẩm 3</h3>
                <p class="price">3.200.000đ</p>
                <button class="btn-buy">Mua ngay</button>
            </div>
            <div class="card">
                <img src="https://via.placeholder.com/250x150" alt="Product 4">
                <h3>Sản phẩm 4</h3>
                <p class="price">1.800.000đ</p>
                <button class="btn-buy">Mua ngay</button>
            </div>
            <div class="card">
                <img src="https://via.placeholder.com/250x150" alt="Product 5">
                <h3>Sản phẩm 5</h3>
                <p class="price">4.500.000đ</p>
                <button class="btn-buy">Mua ngay</button>
            </div>
            <div class="card">
                <img src="https://via.placeholder.com/250x150" alt="Product 6">
                <h3>Sản phẩm 6 mô tả khá dài dòng</h3>
                <p class="price">2.100.000đ</p>
                <button class="btn-buy">Mua ngay</button>
            </div>
            <div class="card">
                <img src="https://via.placeholder.com/250x150" alt="Product 7">
                <h3>Sản phẩm 7</h3>
                <p class="price">5.000.000đ</p>
                <button class="btn-buy">Mua ngay</button>
            </div>
            <div class="card">
                <img src="https://via.placeholder.com/250x150" alt="Product 8">
                <h3>Sản phẩm 8</h3>
                <p class="price">900.000đ</p>
                <button class="btn-buy">Mua ngay</button>
            </div>
        </div>
    </main>
</body>
</html>
