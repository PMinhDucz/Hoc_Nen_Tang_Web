<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="#" method="POST">
        <fieldset>
            <legend> Thong tin tai khoan </legend>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required placeholder="you@email.com">
            <br>
            <label for="pass">Mat khau:</label>
            <input type="password" id="pass" name="pass" required minlength="8"
            pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}"
            title="can it nhat 8 ky tu co du chu hoa, chu thuong va so"
            placeholder="Mat khau toi thieu 8 ky tu">
            <br>
            <label for="phone">sdt:</label>
            <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" required placeholder="123-456-7890">
            <br>
            <label for="dob">dob:</label>
            <input type="date" id="dob" name="dob" max="2005-12-31" >
            <br>

            <button type="submit">Dang ky</button>
        </fieldset>
            <label>
                <input type="checkbox" name="agree" required>
                I agree to the terms and conditions
            </label>    
            <br>
    </form>
</body>
</html>
