<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B2 - CSS Animations & Transitions</title>
    <link rel="stylesheet" href="animations.css">
</head>
<body>
    <h1 class="page-title">CSS Animations & Transitions Demo</h1>

    <section class="section">
        <h2>1. Card Hover Effect</h2>
        <div class="card-grid">
            <div class="card">
                <div class="card-image">
                    <img src="https://via.placeholder.com/280x180" alt="Product">
                </div>
                <div class="card-body">
                    <h3>MacBook Pro M3</h3>
                    <p class="price">45.000.000đ</p>
                    <button class="btn-buy">Mua ngay</button>
                </div>
            </div>
            <div class="card">
                <div class="card-image">
                    <img src="https://via.placeholder.com/280x180" alt="Product">
                </div>
                <div class="card-body">
                    <h3>iPhone 15 Pro</h3>
                    <p class="price">29.000.000đ</p>
                    <button class="btn-buy">Mua ngay</button>
                </div>
            </div>
            <div class="card">
                <div class="card-image">
                    <img src="https://via.placeholder.com/280x180" alt="Product">
                </div>
                <div class="card-body">
                    <h3>iPad Air 5</h3>
                    <p class="price">15.000.000đ</p>
                    <button class="btn-buy">Mua ngay</button>
                </div>
            </div>
        </div>
    </section>

    <section class="section">
        <h2>2. Loading Spinner</h2>
        <div class="spinner-wrapper">
            <div class="spinner"></div>
            <p>Đang tải dữ liệu...</p>
        </div>
    </section>

    <section class="section fade-in-section">
        <h2>3. Fade-in khi scroll</h2>
        <div class="fade-box">
            <p>Nội dung này xuất hiện mượt mà với hiệu ứng fade-in từ dưới lên.</p>
        </div>
    </section>
</body>
</html>
